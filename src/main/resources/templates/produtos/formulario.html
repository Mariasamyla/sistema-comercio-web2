<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
</head>
<body>
    <h1>Cadastrar Produto</h1>
    
    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
        <input type="hidden" th:field="*{id}">

        <label>Nome do Produto:</label>
        <input type="text" th:field="*{nome}" required> 
        <br><br>
        <label>Preço:</label>
        <input type="number" step="0.01" th:field="*{preco}" required>
        <br><br>

        <!-- NOVO CAMPO: Quantidade/Estoque -->
        <label>Quantidade:</label>
        <input type="number" th:field="*{quantidade}" required>
        <br><br>

        <button type="submit">Salvar</button>
    </form>
    
    <br>
    <a th:href="@{/produtos}">Voltar para a lista</a>
</body>
</html>
